# p2c-web-h1 (CT151) — serves the static p2computing.com site.
# TLS terminates on the LBs (CT112/CT113); this vhost is plain HTTP behind them.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name p2computing.com www.p2computing.com;

    root /var/www/p2computing;
    index index.html;

    error_page 404 /404.html;

    # The document root is a git clone, so the repo's own files sit beside the
    # site. Everything that is not the site itself is hidden: .git would hand out
    # the remote and full history, and ops/ holds the edge config with internal
    # addresses in it. 404 rather than 403 — a 403 confirms the path exists.
    location ~ /\.            { return 404; }
    location ^~ /ops/         { return 404; }
    location ~* \.(md|conf)$  { return 404; }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

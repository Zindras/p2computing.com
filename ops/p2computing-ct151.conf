# p2c-web-h1 (CT151) — serves the static p2computing.com site.
# TLS terminates on the LBs (CT112/CT113); this vhost is plain HTTP behind them.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name p2computing.com www.p2computing.com;

    root /var/www/p2computing;
    index index.html;

    error_page 404 /404.html;

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# p2computing.com edge vhost — lives on CT112 AND CT113 (keep in step).
# TLS terminates here; the site itself is static nginx on p2c-web-h1 (CT151).
# Cert renewal rides bf-lb-certsync on p2pmh2, same as battlefinder.com.

# Port 80: serve ACME challenges, redirect everything else to HTTPS.
server {
    listen 80;
    server_name p2computing.com www.p2computing.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type "text/plain";
    }
    location / { return 301 https://p2computing.com$request_uri; }
}

# www is an alias; the apex is canonical.
server {
    listen 443 ssl http2;
    server_name www.p2computing.com;

    ssl_certificate     /etc/letsencrypt/live/p2computing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p2computing.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://p2computing.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name p2computing.com;

    ssl_certificate     /etc/letsencrypt/live/p2computing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p2computing.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://10.0.0.151;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
